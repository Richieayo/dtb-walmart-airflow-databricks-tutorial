models:
  - name: products_t
    description: "This model represents the products table in the silver_t schema."
    columns:
      - name: product_id
        description: "The unique identifier for each product."
        data_tests:
          - not_null:
              config:
                where: "product_id > 0"
          - unique
              
      - name: product_name
        description: "The name of the product."
        data_tests:
          - not_null
      - name: price
        description: "The price of the product."
        data_tests:
          - not_null:
              config:
                where: "price > 0"
  
  - name: orders_t
    description: "This model represents the orders table in the silver_t schema."
    columns:
      - name: order_id
        description: "The unique identifier for each order."
        data_tests:
          - not_null:
              config:
                where: "order_id > 0"
          - unique
      